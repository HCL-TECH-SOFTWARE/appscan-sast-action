name: Supply Chain Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/dependabot.yml'
      - 'scripts/supply-chain-policy.js'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/dependabot.yml'
      - 'scripts/supply-chain-policy.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Ensure npm min-release-age support
        run: npm install --global npm@11.10.0 --ignore-scripts
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Enforce supply-chain controls
        run: npm run supply-chain:policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
